<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>/* pre-paint: apply the saved theme before any CSS renders */
try{var _de=document.documentElement,_qp=new URLSearchParams(location.search);_de.dataset.theme=/^(light|dark)$/.test(_qp.get('theme')||'')?_qp.get('theme'):(localStorage.getItem('showup-theme')||'dark');_de.dataset.skin=localStorage.getItem('showup-skin')||'minimal';if(_qp.get('design')==='modern')_de.dataset.designPreview='modern';}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- v3.3.334: NOT black-translucent. That setting pushes the page behind the
     status bar, and on iOS 26 the system composites its own progressive blur
     over whatever sits in that strip — which is what has been washing out the
     date and the settings button. Every previous attempt fought the effect
     (opaque colours, fixed instead of sticky, transparent-parent glass); the
     effect applies to content in that zone regardless. With the default
     style, iOS insets the web view BELOW the status bar, so nothing of ours
     is under it and there is nothing to blur. env(safe-area-inset-top) then
     reports 0 and the header's own padding shrinks to suit, so the layout
     needs no other change. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ShowUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
