<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tab bar fault injection — local test</title>
<style>body{font:14px system-ui;background:#eee;margin:16px}button{padding:10px;margin:0 6px 12px 0}iframe{display:block;width:390px;height:740px;border:1px solid #aaa}output{display:block;margin:10px 0;white-space:pre-wrap}</style>
<button id="break">Inject stacked layout</button><button id="repair">Run recovery</button><button id="measure">Measure row</button>
<button data-width="320">320px</button><button data-width="390">390px</button><button data-width="430">430px</button>
<output id="result">Local test only. No user data is read or changed.</output>
<iframe src="../index.html?theme=light" title="Tab-bar recovery test app"></iframe>
<script>
const frame=document.querySelector('iframe'),result=document.querySelector('output');
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px'});
document.querySelector('#break').onclick=()=>{
  const d=frame.contentDocument,n=d.querySelector('#nav');
  n.removeAttribute('style');delete n.dataset.layoutRecovered;delete n.dataset.layoutFailure;
  n.style.setProperty('display','block','important');n.style.setProperty('width','110vw','important');
  n.style.setProperty('max-width','none','important');n.style.setProperty('height','auto','important');
  [...n.children].forEach(b=>b.removeAttribute('style'));
  result.textContent='Injected block layout and oversized panel. Press Run recovery.';
};
document.querySelector('#repair').onclick=()=>{frame.contentWindow.repairNavLayout();measure()};
function measure(){
  const n=frame.contentDocument.querySelector('#nav'),r=n.getBoundingClientRect(),bs=[...n.children].map(b=>b.getBoundingClientRect());
  const pass=bs.every(b=>Math.abs(b.top-bs[0].top)<1)&&r.height<80&&r.right<=frame.contentDocument.documentElement.clientWidth+1;
  result.textContent=JSON.stringify({pass,height:r.height,width:r.width,tops:bs.map(b=>b.top),recovered:n.dataset.layoutRecovered||false});
}
document.querySelector('#measure').onclick=measure;
</script>
